name: HKI pricing read-only CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pricing-readonly-ci
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sources
        run: python -m compileall -q pricing.py shopify_read.py shopify_preview.py
      - name: Run read-only unit tests
        run: python -m unittest discover -v -p 'test_*.py'
